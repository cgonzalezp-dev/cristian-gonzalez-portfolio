<script>
/* ===========================================================================
   Charts.html — inline SVG renderer. No charting library, no CDN.

   Design rules, all of them deliberate:

   - TARGET, BENCHMARK AND SERIES ARE THREE DISTINCT VISUAL OBJECTS.
     A target is a goal someone set. A benchmark is another population's actual
     result. A series is what happened. Rendering them alike is how a reader
     ends up believing a cohort gap is a trend.
       series    solid line, accent colour
       target    dashed, amber
       benchmark dotted, muted grey

   - MISSING PERIODS BREAK THE LINE. A week with no data must read as a gap,
     never as a straight segment joining the weeks either side of it.

   - COLOUR IS SEMANTIC. A single-series chart is monochrome; categorical
     colour appears only when several series genuinely must be told apart.
   ========================================================================= */

const Charts = (function () {

  const PAD = { top: 16, right: 16, bottom: 30, left: 46 };

  /* Categorical ramp — used only for multi-series charts. Ordered so the first
     two are distinguishable in both themes and in greyscale. */
  const RAMP = ['var(--text)', 'var(--accent-soft)', '#0b6e99', '#8a5a00',
                '#5b21b6', '#04724d'];

  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  /**
   * Render a chart payload from ChartConfig.render().
   * @return {!Element}
   */
  function render(payload, opts) {
    const options = opts || {};
    if (!payload || payload.empty) {
      return emptyState('No data for this view',
        'Once values are submitted for the selected metric and periods, this chart ' +
        'will populate automatically.');
    }
    switch (payload.chart.chart_type) {
      case 'KPI_CARD':    return kpiCard(payload);
      case 'BAR':         return barChart(payload, options, true);
      case 'COLUMN':      return barChart(payload, options, false);
      case 'STACKED_BAR': return stackedChart(payload, options);
      case 'AREA':        return lineChart(payload, options, true);
      case 'COMPARISON':  return comparisonChart(payload, options);
      case 'LINE':
      default:            return lineChart(payload, options, false);
    }
  }

  /* -------------------------------------------------------------- scales */

  function scale(payload, options) {
    let values = [];
    payload.series.forEach(function (s) {
      s.points.forEach(function (p) { if (p.value != null) values.push(p.value); });
      if (s.target && s.target.constant != null) values.push(s.target.constant);
      if (s.target && s.target.steps) {
        s.target.steps.forEach(function (t) { if (t != null) values.push(t); });
      }
    });
    if (payload.benchmark) {
      payload.benchmark.points.forEach(function (v) { if (v != null) values.push(v); });
    }
    if (!values.length) values = [0, 1];

    let min = Math.min.apply(null, values);
    let max = Math.max.apply(null, values);

    if (payload.chart.y_min != null) min = payload.chart.y_min;
    if (payload.chart.y_max != null) max = payload.chart.y_max;

    // Headroom so the top point is not welded to the frame. Percentages are
    // NOT forced to a 0-100 axis: an 88-94% range compressed into 0-100 hides
    // exactly the movement the chart exists to show.
    const span = (max - min) || Math.abs(max) || 1;
    if (payload.chart.y_min == null) min = min - span * 0.12;
    if (payload.chart.y_max == null) max = max + span * 0.12;

    const unit = payload.metric ? payload.metric.unit : null;
    if (unit === 'PERCENT' || unit === 'COUNT' || unit === 'SECONDS') {
      min = Math.max(0, min);
    }
    if (min === max) { min -= 1; max += 1; }
    return { min: min, max: max };
  }

  function ticks(min, max, count) {
    const out = [];
    for (let i = 0; i <= count; i++) out.push(min + (max - min) * (i / count));
    return out;
  }

  function frame(width, height, sc, labels, payload) {
    const plotW = width - PAD.left - PAD.right;
    const plotH = height - PAD.top - PAD.bottom;
    const g = [];

    // Horizontal gridlines + y labels
    ticks(sc.min, sc.max, 4).forEach(function (t) {
      const y = PAD.top + plotH - ((t - sc.min) / (sc.max - sc.min)) * plotH;
      g.push('<line x1="' + PAD.left + '" y1="' + y.toFixed(1) +
             '" x2="' + (width - PAD.right) + '" y2="' + y.toFixed(1) +
             '" stroke="var(--border)" stroke-width="1"/>');
      g.push('<text x="' + (PAD.left - 8) + '" y="' + (y + 3.5).toFixed(1) +
             '" text-anchor="end" font-size="10" fill="var(--text-subtle)">' +
             esc(shortValue(t, payload)) + '</text>');
    });

    // X labels, thinned so they never collide
    const step = Math.max(1, Math.ceil(labels.length / 9));
    labels.forEach(function (label, i) {
      if (i % step !== 0 && i !== labels.length - 1) return;
      const x = xAt(i, labels.length, plotW);
      g.push('<text x="' + x.toFixed(1) + '" y="' + (height - 10) +
             '" text-anchor="middle" font-size="10" fill="var(--text-subtle)">' +
             esc(truncate(label, 11)) + '</text>');
    });
    return g.join('');
  }

  function xAt(i, count, plotW) {
    if (count <= 1) return PAD.left + plotW / 2;
    return PAD.left + (i / (count - 1)) * plotW;
  }

  function yAt(value, sc, plotH) {
    return PAD.top + plotH - ((value - sc.min) / (sc.max - sc.min)) * plotH;
  }

  function shortValue(v, payload) {
    const unit = payload.metric ? payload.metric.unit : null;
    if (unit === 'SECONDS') return fmtDuration(v);
    if (unit === 'PERCENT') return v.toFixed(0) + '%';
    if (Math.abs(v) >= 10000) return (v / 1000).toFixed(0) + 'k';
    return Number(v.toFixed(Math.abs(v) < 10 ? 1 : 0)).toLocaleString('en-US');
  }

  function truncate(s, n) {
    s = String(s);
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
  }

  /* ---------------------------------------------------------- line/area */

  function lineChart(payload, options, filled) {
    const width = options.width || 640;
    const height = options.height || 240;
    const plotW = width - PAD.left - PAD.right;
    const plotH = height - PAD.top - PAD.bottom;
    const sc = scale(payload, options);
    const labels = payload.labels;

    let svg = frame(width, height, sc, labels, payload);

    // Target — dashed, amber, drawn beneath the data.
    payload.series.forEach(function (s) {
      if (!s.target) return;
      if (s.target.constant != null) {
        const y = yAt(s.target.constant, sc, plotH);
        svg += '<line x1="' + PAD.left + '" y1="' + y.toFixed(1) +
               '" x2="' + (width - PAD.right) + '" y2="' + y.toFixed(1) +
               '" stroke="var(--warning)" stroke-width="1.5" stroke-dasharray="5 4"/>';
        svg += '<text x="' + (width - PAD.right) + '" y="' + (y - 5).toFixed(1) +
               '" text-anchor="end" font-size="9.5" font-weight="600" ' +
               'fill="var(--warning)">TARGET ' +
               esc(shortValue(s.target.constant, payload)) + '</text>';
      } else if (s.target.steps) {
        // The target changed mid-window (effective dating). Drawn as a step,
        // which is the honest rendering — the goal genuinely moved.
        let d = '', open = false;
        s.target.steps.forEach(function (t, i) {
          if (t == null) { open = false; return; }
          const x = xAt(i, labels.length, plotW), y = yAt(t, sc, plotH);
          d += (open ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
          open = true;
        });
        svg += '<path d="' + d + '" fill="none" stroke="var(--warning)" ' +
               'stroke-width="1.5" stroke-dasharray="5 4"/>';
      }
    });

    // Benchmark — dotted, muted. Visually unlike both target and series.
    if (payload.benchmark) {
      const d = pathFor(payload.benchmark.points, sc, plotW, plotH, labels.length);
      svg += '<path d="' + d + '" fill="none" stroke="var(--text-subtle)" ' +
             'stroke-width="1.5" stroke-dasharray="2 3"/>';
    }

    payload.series.forEach(function (s, si) {
      const colour = payload.series.length > 1 ? RAMP[si % RAMP.length] : 'var(--text)';
      const values = s.points.map(function (p) { return p.value; });
      const d = pathFor(values, sc, plotW, plotH, labels.length);

      if (filled) {
        const area = areaFor(values, sc, plotW, plotH, labels.length);
        svg += '<path d="' + area + '" fill="' + colour + '" opacity=".07"/>';
      }
      svg += '<path d="' + d + '" fill="none" stroke="' + colour +
             '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';

      // Points. Hollow markers where the sample is below threshold, so a value
      // built on four observations never looks as solid as one built on four
      // hundred.
      s.points.forEach(function (p, i) {
        if (p.value == null) return;
        const x = xAt(i, labels.length, plotW), y = yAt(p.value, sc, plotH);
        const weak = p.n != null && p.n > 0 && p.n < 20;
        svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3" ' +
               'fill="' + (weak ? 'var(--surface)' : colour) + '" stroke="' + colour +
               '" stroke-width="1.6"><title>' + esc(p.label + ': ' + p.display +
               (p.n ? ' (n=' + p.n + ')' : '')) + '</title></circle>';

        if (payload.chart.show_data_labels) {
          svg += '<text x="' + x.toFixed(1) + '" y="' + (y - 9).toFixed(1) +
                 '" text-anchor="middle" font-size="9.5" font-weight="600" ' +
                 'fill="var(--text-muted)">' + esc(p.display) + '</text>';
        }
      });
    });

    return chartShell(payload, svg, width, height, options);
  }

  function pathFor(values, sc, plotW, plotH, count) {
    let d = '', open = false;
    values.forEach(function (v, i) {
      if (v == null) { open = false; return; }   // gap, not a straight line
      const x = xAt(i, count, plotW), y = yAt(v, sc, plotH);
      d += (open ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
      open = true;
    });
    return d;
  }

  function areaFor(values, sc, plotW, plotH, count) {
    const base = PAD.top + plotH;
    let d = '', open = false, firstX = null, lastX = null;
    values.forEach(function (v, i) {
      if (v == null) return;
      const x = xAt(i, count, plotW), y = yAt(v, sc, plotH);
      if (!open) { firstX = x; d += 'M' + x.toFixed(1) + ' ' + base + ' L'; open = true; }
      else d += 'L';
      d += x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
      lastX = x;
    });
    if (!open) return '';
    return d + 'L' + lastX.toFixed(1) + ' ' + base + ' Z';
  }

  /* --------------------------------------------------------------- bars */

  function barChart(payload, options, horizontal) {
    const width = options.width || 640;
    const height = options.height || 240;
    const sc = scale(payload, options);
    const labels = payload.labels;
    const plotW = width - PAD.left - PAD.right;
    const plotH = height - PAD.top - PAD.bottom;

    let svg = frame(width, height, sc, labels, payload);

    const series = payload.series;
    const groupW = plotW / Math.max(1, labels.length);
    const barW = Math.max(3, (groupW * 0.62) / series.length);

    series.forEach(function (s, si) {
      const colour = series.length > 1 ? RAMP[si % RAMP.length] : 'var(--text)';
      s.points.forEach(function (p, i) {
        if (p.value == null) return;
        const centre = PAD.left + groupW * (i + 0.5);
        const x = centre - (barW * series.length) / 2 + barW * si;
        const y = yAt(p.value, sc, plotH);
        const base = yAt(Math.max(sc.min, 0), sc, plotH);
        const top = Math.min(y, base);
        const h = Math.max(1, Math.abs(base - y));

        svg += '<rect x="' + x.toFixed(1) + '" y="' + top.toFixed(1) +
               '" width="' + barW.toFixed(1) + '" height="' + h.toFixed(1) +
               '" rx="2" fill="' + colour + '" opacity=".9"><title>' +
               esc(p.label + ': ' + p.display + (p.n ? ' (n=' + p.n + ')' : '')) +
               '</title></rect>';

        if (payload.chart.show_data_labels) {
          svg += '<text x="' + (x + barW / 2).toFixed(1) + '" y="' + (top - 5).toFixed(1) +
                 '" text-anchor="middle" font-size="9.5" font-weight="600" ' +
                 'fill="var(--text-muted)">' + esc(p.display) + '</text>';
        }
      });

      if (s.target && s.target.constant != null) {
        const y = yAt(s.target.constant, sc, plotH);
        svg += '<line x1="' + PAD.left + '" y1="' + y.toFixed(1) + '" x2="' +
               (width - PAD.right) + '" y2="' + y.toFixed(1) +
               '" stroke="var(--warning)" stroke-width="1.5" stroke-dasharray="5 4"/>';
      }
    });

    return chartShell(payload, svg, width, height, options);
  }

  function stackedChart(payload, options) {
    const width = options.width || 640;
    const height = options.height || 240;
    const labels = payload.labels;
    const plotW = width - PAD.left - PAD.right;
    const plotH = height - PAD.top - PAD.bottom;

    // Stacks need their own scale — the axis must reach the tallest total.
    const totals = labels.map(function (_, i) {
      return payload.series.reduce(function (acc, s) {
        const v = s.points[i] ? s.points[i].value : null;
        return acc + (v || 0);
      }, 0);
    });
    const sc = { min: 0, max: Math.max.apply(null, totals) * 1.12 || 1 };

    let svg = frame(width, height, sc, labels, payload);
    const groupW = plotW / Math.max(1, labels.length);
    const barW = groupW * 0.62;

    labels.forEach(function (_, i) {
      let cumulative = 0;
      payload.series.forEach(function (s, si) {
        const v = s.points[i] ? s.points[i].value : null;
        if (v == null) return;
        const yTop = yAt(cumulative + v, sc, plotH);
        const yBottom = yAt(cumulative, sc, plotH);
        const x = PAD.left + groupW * (i + 0.5) - barW / 2;
        svg += '<rect x="' + x.toFixed(1) + '" y="' + yTop.toFixed(1) +
               '" width="' + barW.toFixed(1) + '" height="' +
               Math.max(1, yBottom - yTop).toFixed(1) + '" fill="' +
               RAMP[si % RAMP.length] + '" opacity=".9"><title>' +
               esc(s.name + ' — ' + s.points[i].label + ': ' + s.points[i].display) +
               '</title></rect>';
        cumulative += v;
      });
    });

    return chartShell(payload, svg, width, height, options);
  }

  /** Current vs comparison, side by side per subject. */
  function comparisonChart(payload, options) {
    return barChart(payload, options, false);
  }

  /* ---------------------------------------------------------- KPI card */

  function kpiCard(payload) {
    const s = payload.series[0];
    if (!s || !s.current) {
      return emptyState('No data', 'No value recorded for the selected period.');
    }
    return el('div', { class: 'kpi' }, [
      el('div', { class: 'kpi-label' }, [el('span', { text: payload.chart.title })]),
      el('div', { class: 'kpi-value', text: s.current.display }),
      el('div', { class: 'kpi-meta' }, [
        deltaChip(s.vs_prior),
        s.vs_target ? statusPill(s.current.status) : null,
        provenanceBadges(s.current, payload.metric)
      ]),
      payload.chart.subtitle
        ? el('div', { class: 'kpi-context', text: payload.chart.subtitle }) : null
    ]);
  }

  /* ------------------------------------------------------------- shell */

  function chartShell(payload, svgInner, width, height, options) {
    const wrap = el('div', {});

    if (payload.series.length > 1 || payload.benchmark ||
        payload.chart.show_target_line) {
      const legend = el('div', { class: 'chart-legend' });
      payload.series.forEach(function (s, i) {
        legend.appendChild(el('span', { class: 'legend-item' }, [
          el('span', { class: 'legend-swatch',
            style: 'background:' + (payload.series.length > 1
              ? RAMP[i % RAMP.length] : 'var(--text)') }),
          el('span', { text: s.name })
        ]));
      });
      if (payload.chart.show_target_line) {
        legend.appendChild(el('span', {
          class: 'legend-item', style: 'color:var(--warning)',
          title: 'A target is a goal that was set — not a statistical boundary.'
        }, [
          el('span', { class: 'legend-swatch dashed' }),
          el('span', { text: 'Target' })
        ]));
      }
      if (payload.benchmark) {
        legend.appendChild(el('span', {
          class: 'legend-item', style: 'color:var(--text-subtle)',
          title: 'A benchmark is another population\'s actual result.'
        }, [
          el('span', { class: 'legend-swatch dashed' }),
          el('span', { text: payload.benchmark.name })
        ]));
      }
      wrap.appendChild(legend);
    }

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    svg.setAttribute('class', 'chart-svg');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', payload.chart.title +
      (payload.chart.subtitle ? '. ' + payload.chart.subtitle : ''));
    svg.innerHTML = svgInner;
    wrap.appendChild(svg);

    if (payload.chart.footer) {
      wrap.appendChild(el('div', { class: 'tiny subtle',
        style: 'padding:6px 4px 0', text: payload.chart.footer }));
    }
    return wrap;
  }

  /* -------------------------------------------------------- sparkline */

  /** Compact trend for KPI tiles and scorecard rows. */
  function sparkline(values, direction) {
    const clean = values.filter(function (v) { return v != null; });
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'sparkline');
    svg.setAttribute('viewBox', '0 0 100 34');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    if (clean.length < 2) return svg;

    const min = Math.min.apply(null, clean);
    const max = Math.max.apply(null, clean);
    const span = (max - min) || 1;

    let d = '', open = false;
    values.forEach(function (v, i) {
      if (v == null) { open = false; return; }
      const x = (i / (values.length - 1)) * 100;
      const y = 30 - ((v - min) / span) * 26;
      d += (open ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
      open = true;
    });

    svg.innerHTML = '<path d="' + d + '" fill="none" stroke="var(--text-muted)" ' +
                    'stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>';
    return svg;
  }

  return { render: render, sparkline: sparkline };
})();
</script>
