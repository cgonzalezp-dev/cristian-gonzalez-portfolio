<script>
/* ===========================================================================
   Components.html — API client, UI primitives, formatting.
   No framework, no CDN. Everything below is reused by every view.
   ========================================================================= */

/* ------------------------------------------------------------ API client */

const API = (function () {
  const inflight = {};

  /**
   * Call the server. One entry point mirrors the one entry point on the server.
   * @return {!Promise<*>} resolves with data, rejects with {code, message}
   */
  function call(action, payload) {
    const key = action + ':' + JSON.stringify(payload || {});
    if (inflight[key]) return inflight[key];

    const p = new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (res) {
          delete inflight[key];
          if (res && res.ok) resolve(res.data);
          else reject((res && res.error) ||
                      { code: 'UNKNOWN', message: 'No response from the server.' });
        })
        .withFailureHandler(function (err) {
          delete inflight[key];
          reject({ code: 'TRANSPORT', message: err && err.message
                   ? err.message : 'Could not reach the server.' });
        })
        .api(action, payload || {});
    });
    inflight[key] = p;
    return p;
  }
  return { call: call };
})();

/* --------------------------------------------------------------- helpers */

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === 'class') node.className = attrs[k];
    else if (k === 'html') node.innerHTML = attrs[k];
    else if (k === 'text') node.textContent = attrs[k];
    else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') {
      node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    } else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) {
      node.setAttribute(k, attrs[k]);
    }
  });
  (children || []).forEach(function (c) {
    if (c == null) return;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return node;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function qs(sel, root) { return (root || document).querySelector(sel); }
function qsa(sel, root) {
  return Array.prototype.slice.call((root || document).querySelectorAll(sel));
}

/* ------------------------------------------------------------ formatting */

/**
 * Client-side mirror of the server formatter. Presentation only — the server
 * remains the authority on values; this keeps the UI responsive without a
 * round trip for every re-render.
 */
function fmtValue(value, unit, dp) {
  if (value == null || !isFinite(value)) return '—';
  const d = dp == null ? 1 : dp;
  switch (unit) {
    case 'PERCENT':      return value.toFixed(d) + '%';
    case 'RATIO':        return value.toFixed(d + 2);
    case 'SECONDS':      return fmtDuration(value);
    case 'MINUTES':      return fmtDuration(value * 60);
    case 'CURRENCY_USD': return '$' + value.toLocaleString('en-US',
                                { minimumFractionDigits: d, maximumFractionDigits: d });
    case 'COUNT':        return Math.round(value).toLocaleString('en-US');
    default:             return value.toFixed(d);
  }
}

function fmtDuration(seconds) {
  if (seconds == null || !isFinite(seconds)) return '—';
  const t = Math.round(Math.abs(seconds));
  const sign = seconds < 0 ? '-' : '';
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const p2 = function (n) { return ('0' + n).slice(-2); };
  return sign + (h > 0 ? h + ':' + p2(m) : String(m)) + ':' + p2(s);
}

function fmtNumber(n, dp) {
  if (n == null || !isFinite(n)) return '—';
  return Number(n).toLocaleString('en-US',
    { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 });
}

/* ----------------------------------------------------------------- icons */

const ICONS = {
  dashboard: '<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
  lob:       '<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>',
  metric:    '<path d="M3 3v18h18"/><path d="M7 15l4-6 4 4 5-8"/>',
  entry:     '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
  config:    '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 007 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H1a2 2 0 110-4h.1A1.6 1.6 0 002.6 9a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H7a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/>',
  up:        '<path d="M12 19V5M5 12l7-7 7 7"/>',
  down:      '<path d="M12 5v14M19 12l-7 7-7-7"/>',
  flat:      '<path d="M5 12h14"/>',
  check:     '<path d="M20 6L9 17l-5-5"/>',
  alert:     '<path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  info:      '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  plus:      '<path d="M12 5v14M5 12h14"/>',
  refresh:   '<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0114.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0020.5 15"/>',
  moon:      '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
  sun:       '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M5 5l1.5 1.5M17.5 17.5L19 19M2 12h2M20 12h2M5 19l1.5-1.5M17.5 6.5L19 5"/>',
  x:         '<path d="M18 6L6 18M6 6l12 12"/>',
  chevron:   '<path d="M9 18l6-6-6-6"/>'
};

function icon(name, size) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
         'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ' +
         'width="' + (size || 14) + '" height="' + (size || 14) + '">' +
         (ICONS[name] || '') + '</svg>';
}

/* ---------------------------------------------------------------- toasts */

const Toast = (function () {
  function host() {
    let h = qs('.toasts');
    if (!h) { h = el('div', { class: 'toasts' }); document.body.appendChild(h); }
    return h;
  }
  function show(kind, title, body, ms) {
    const iconName = kind === 'success' ? 'check'
                   : kind === 'error' ? 'alert'
                   : kind === 'warn' ? 'alert' : 'info';
    const node = el('div', { class: 'toast toast-' + kind }, [
      el('span', { class: 'insight-icon', html: icon(iconName, 15) }),
      el('div', {}, [
        el('div', { class: 'toast-title', text: title }),
        body ? el('div', { class: 'toast-body', text: body }) : null
      ])
    ]);
    host().appendChild(node);
    setTimeout(function () {
      node.style.opacity = '0';
      node.style.transition = 'opacity .2s';
      setTimeout(function () { node.remove(); }, 220);
    }, ms || (kind === 'error' ? 7000 : 4000));
  }
  return {
    success: function (t, b) { show('success', t, b); },
    error:   function (t, b) { show('error', t, b); },
    warn:    function (t, b) { show('warn', t, b); },
    info:    function (t, b) { show('info', t, b); }
  };
})();

/* ---------------------------------------------------------------- modal */

const Modal = (function () {
  let current = null;

  function open(opts) {
    close();
    const body = el('div', { class: 'modal-body' });
    if (typeof opts.body === 'string') body.innerHTML = opts.body;
    else if (opts.body) body.appendChild(opts.body);

    const foot = el('div', { class: 'modal-foot' });
    (opts.actions || []).forEach(function (a) {
      foot.appendChild(el('button', {
        class: 'btn ' + (a.primary ? 'btn-primary' : a.danger ? 'btn-danger' : ''),
        text: a.label,
        onclick: function () { a.onClick && a.onClick(body); }
      }));
    });

    const modal = el('div', { class: 'modal ' + (opts.wide ? 'modal-lg' : '') }, [
      el('div', { class: 'modal-head' }, [
        el('div', {}, [
          el('h2', { class: 'modal-title', text: opts.title }),
          opts.subtitle ? el('p', { class: 'modal-sub', text: opts.subtitle }) : null
        ]),
        el('button', {
          class: 'btn btn-ghost btn-sm', html: icon('x', 15),
          style: 'margin-left:auto', 'aria-label': 'Close', onclick: close
        })
      ]),
      body,
      (opts.actions || []).length ? foot : null
    ]);

    const backdrop = el('div', {
      class: 'modal-backdrop',
      onclick: function (e) { if (e.target === backdrop) close(); }
    }, [modal]);

    document.body.appendChild(backdrop);
    current = backdrop;
    document.addEventListener('keydown', onKey);

    const focusable = modal.querySelector(
      'input, select, textarea, button:not([aria-label="Close"])');
    if (focusable) focusable.focus();
    return body;
  }

  function onKey(e) { if (e.key === 'Escape') close(); }

  function close() {
    if (current) { current.remove(); current = null; }
    document.removeEventListener('keydown', onKey);
  }

  return { open: open, close: close };
})();

/* --------------------------------------------------------- UI fragments */

/** Skeleton placeholder while a view loads. */
function skeletonGrid(count, className) {
  const wrap = el('div', { class: 'grid ' + (className || 'grid-4') });
  for (let i = 0; i < (count || 4); i++) {
    wrap.appendChild(el('div', { class: 'card' }, [
      el('div', { class: 'kpi' }, [
        el('div', { class: 'skeleton skel-line', style: 'width:45%' }),
        el('div', { class: 'skeleton', style: 'height:32px;width:65%;margin:10px 0' }),
        el('div', { class: 'skeleton skel-line', style: 'width:35%' })
      ])
    ]));
  }
  return wrap;
}

function emptyState(title, body, action) {
  return el('div', { class: 'empty' }, [
    el('div', { class: 'empty-title', text: title }),
    el('div', { class: 'empty-body', text: body }),
    action ? el('button', {
      class: 'btn btn-primary', text: action.label, onclick: action.onClick
    }) : null
  ]);
}

/**
 * Delta chip. The visual treatment encodes comparison_type, so a movement over
 * time can never be mistaken for a gap against a cohort or a distance from
 * target — the exact confusion that motivated typed deltas in the first place.
 */
function deltaChip(delta, opts) {
  if (!delta || delta.interpretation === 'INSUFFICIENT_DATA') {
    return el('span', { class: 'delta delta-none', text: '—' });
  }
  const cls = delta.interpretation === 'IMPROVED' ? 'delta-improved'
            : delta.interpretation === 'DECLINED' ? 'delta-declined'
            : 'delta-stable';
  const typeCls = delta.comparison_type === 'VS_COHORT' ? ' delta-cohort'
                : delta.comparison_type === 'VS_TARGET' ? ' delta-target' : '';
  const glyph = delta.interpretation === 'STABLE' ? 'flat'
              : (delta.absolute_change > 0 ? 'up' : 'down');

  const chip = el('span', { class: 'delta ' + cls + typeCls }, [
    el('span', { html: icon(glyph, 11) }),
    el('span', { text: delta.display })
  ]);

  const label = { VS_PRIOR_PERIOD: 'vs ' + (delta.label_from || 'previous period'),
                  VS_TARGET: 'vs target',
                  VS_COHORT: 'vs ' + (delta.cohort_label || 'benchmark'),
                  VS_ROLLING_AVG: 'vs ' + (delta.label_from || 'rolling average') }
                [delta.comparison_type] || '';
  chip.title = label + (delta.reliable === false
    ? ' — sample size below threshold, treat with caution' : '');

  if (opts && opts.withLabel && label) {
    return el('span', { class: 'row', style: 'gap:6px' },
      [chip, el('span', { class: 'tiny subtle', text: label })]);
  }
  return chip;
}

/** Status pill — colour is always paired with a glyph and a word. */
function statusPill(status) {
  const map = {
    ON_TARGET:         ['pill-on',   'On target'],
    ABOVE_TARGET:      ['pill-off',  'Above target'],
    BELOW_TARGET:      ['pill-off',  'Below target'],
    AT_RISK:           ['pill-risk', 'At risk'],
    NO_TARGET:         ['pill-none', 'No target'],
    INSUFFICIENT_DATA: ['pill-none', 'No data']
  };
  const spec = map[status] || map.NO_TARGET;
  return el('span', { class: 'pill ' + spec[0] }, [
    el('span', { class: 'pill-dot' }),
    el('span', { text: spec[1] })
  ]);
}

/**
 * Provenance badges. Sample size and aggregation method travel with the number
 * they describe — a value shown without its denominator is how six arithmetic
 * errors got into the source material this platform replaces.
 */
function provenanceBadges(point, metric) {
  const wrap = el('span', { class: 'row', style: 'gap:5px' });
  if (point && point.observation_count) {
    wrap.appendChild(el('span', {
      class: 'badge badge-n',
      text: 'n=' + fmtNumber(point.observation_count),
      title: 'Observations behind this value'
    }));
  }
  if (point && point.is_weighted === false && point.contributor_count > 1) {
    wrap.appendChild(el('span', {
      class: 'badge badge-warn', text: 'unweighted',
      title: 'Rolled up as a simple average because denominators are missing. ' +
             'Contributors with different sample sizes carry equal weight.'
    }));
  }
  return wrap;
}

function insightList(insights) {
  if (!insights || !insights.length) {
    return el('div', { class: 'card-body muted small', text: 'No observations yet.' });
  }
  const wrap = el('div', {});
  insights.forEach(function (i) {
    const glyph = i.severity === 'CRITICAL' || i.severity === 'WARNING' ? 'alert'
                : i.severity === 'POSITIVE' ? 'check' : 'info';
    wrap.appendChild(el('div', { class: 'insight insight-' + i.severity }, [
      el('span', { class: 'insight-icon', html: icon(glyph, 14) }),
      el('span', { text: i.text })
    ]));
  });
  return wrap;
}

/** Labelled select, built from a list of {value,label}. */
function selectField(opts) {
  const sel = el('select', { class: 'select', id: opts.id || '' });
  if (opts.placeholder) {
    sel.appendChild(el('option', { value: '', text: opts.placeholder }));
  }
  (opts.options || []).forEach(function (o) {
    const option = el('option', { value: o.value, text: o.label });
    if (String(o.value) === String(opts.value)) option.selected = true;
    sel.appendChild(option);
  });
  if (opts.onChange) sel.addEventListener('change', function () { opts.onChange(sel.value); });
  if (opts.bare) return sel;
  return el('div', { class: opts.inline ? 'filter' : 'field' }, [
    el('label', { class: opts.inline ? 'filter-label' : 'field-label', text: opts.label }),
    sel
  ]);
}

function inputField(opts) {
  const input = el(opts.type === 'textarea' ? 'textarea' : 'input', {
    class: opts.type === 'textarea' ? 'textarea' : 'input',
    type: opts.type === 'textarea' ? null : (opts.type || 'text'),
    value: opts.value == null ? '' : opts.value,
    placeholder: opts.placeholder || '',
    id: opts.id || '',
    step: opts.step || null,
    min: opts.min != null ? opts.min : null,
    max: opts.max != null ? opts.max : null,
    readonly: opts.readonly ? 'readonly' : null
  });
  if (opts.onInput) input.addEventListener('input', function () { opts.onInput(input.value); });
  return el('div', { class: 'field' }, [
    el('label', { class: 'field-label' }, [
      el('span', { text: opts.label }),
      opts.required ? el('span', { class: 'field-req', text: '*' }) : null
    ]),
    input,
    opts.hint ? el('div', { class: 'field-hint', text: opts.hint }) : null,
    el('div', { class: 'field-error hidden' })
  ]);
}

/** Collect a form's values by field id. */
function readForm(root, keys) {
  const out = {};
  keys.forEach(function (k) {
    const node = qs('#' + k, root);
    if (!node) return;
    if (node.type === 'checkbox') out[k] = node.checked;
    else if (node.multiple) {
      out[k] = Array.prototype.slice.call(node.selectedOptions)
        .map(function (o) { return o.value; });
    } else out[k] = node.value;
  });
  return out;
}

/** Sortable table. Sorting happens client-side — no round trip. */
function dataTable(columns, rows, opts) {
  const options = opts || {};
  let sortKey = options.sortKey || null;
  let sortDir = options.sortDir || 1;

  const wrap = el('div', { class: 'table-wrap' });
  const table = el('table', { class: 'data' });
  const thead = el('thead');
  const tbody = el('tbody');

  function renderHead() {
    thead.innerHTML = '';
    const tr = el('tr');
    columns.forEach(function (c) {
      const th = el('th', {
        class: (c.numeric ? 'num ' : '') + (c.sortable === false ? '' : 'sortable'),
        title: c.title || ''
      }, [
        el('span', { text: c.label }),
        sortKey === c.key
          ? el('span', { text: sortDir > 0 ? ' ↑' : ' ↓' }) : null
      ]);
      if (c.sortable !== false) {
        th.addEventListener('click', function () {
          if (sortKey === c.key) sortDir = -sortDir;
          else { sortKey = c.key; sortDir = c.numeric ? -1 : 1; }
          renderHead(); renderBody();
        });
      }
      tr.appendChild(th);
    });
    thead.appendChild(tr);
  }

  function renderBody() {
    const sorted = rows.slice();
    if (sortKey) {
      sorted.sort(function (a, b) {
        const col = columns.filter(function (c) { return c.key === sortKey; })[0];
        const va = col.sortValue ? col.sortValue(a) : a[sortKey];
        const vb = col.sortValue ? col.sortValue(b) : b[sortKey];
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * sortDir;
        return String(va).localeCompare(String(vb)) * sortDir;
      });
    }
    tbody.innerHTML = '';
    if (!sorted.length) {
      tbody.appendChild(el('tr', {}, [
        el('td', { colspan: columns.length, class: 'muted small',
                   style: 'text-align:center;padding:28px',
                   text: options.emptyText || 'No records.' })
      ]));
      return;
    }
    sorted.forEach(function (row) {
      const tr = el('tr', { class: row.__lowSample ? 'low-sample' : '' });
      columns.forEach(function (c) {
        const td = el('td', { class: c.numeric ? 'num' : '' });
        const content = c.render ? c.render(row) : row[c.key];
        if (content == null) td.textContent = '—';
        else if (typeof content === 'string' || typeof content === 'number') {
          td.textContent = content;
        } else td.appendChild(content);
        tr.appendChild(td);
      });
      if (options.onRowClick) {
        tr.style.cursor = 'pointer';
        tr.addEventListener('click', function () { options.onRowClick(row); });
      }
      tbody.appendChild(tr);
    });
  }

  renderHead(); renderBody();
  table.appendChild(thead); table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}
</script>
